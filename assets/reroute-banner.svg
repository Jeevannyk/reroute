<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-label="Reroute: a flight is cancelled, the bookings after it break, and Reroute recovers the trip using a backup seat it held early">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b33"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e2a44"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="640" y="20" width="540" height="380" rx="14" fill="url(#dots)"/>

  <!-- warning-sign pulse at origin, until the cancellation -->
  <g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.29;0.31;1" dur="10s" repeatCount="indefinite"/>
    <circle cx="730" cy="320" r="10" fill="none" stroke="#fbbf24" stroke-width="2">
      <animate attributeName="r" values="10;34" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- booked route: flight to the connecting city, then train to the destination -->
  <path d="M730,320 C800,170 980,120 1100,140" fill="none" stroke-width="3.5" stroke-linecap="round">
    <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#f87171" keyTimes="0;0.3;0.315;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;1;0.45;0.45" keyTimes="0;0.72;0.76;1" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M1100,140 C1095,210 1070,290 1040,330" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 9">
    <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#f87171" keyTimes="0;0.4;0.415;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;1;0.45;0.45" keyTimes="0;0.72;0.76;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- backup seat held early: faint dashed preview of the overnight train -->
  <path d="M730,320 C820,405 950,405 1040,330" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 8" opacity="0">
    <animate attributeName="opacity" values="0;0;0.45;0.45" keyTimes="0;0.12;0.15;1" dur="10s" repeatCount="indefinite"/>
  </path>
  <!-- recovery: the backup route draws in -->
  <path d="M730,320 C820,405 950,405 1040,330" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"
        pathLength="1" stroke-dasharray="1 1" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.47;0.72;1" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- plane flying the booked flight, stops when it is cancelled -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.34;1" dur="10s" repeatCount="indefinite"/>
    <animateMotion path="M730,320 C800,170 980,120 1100,140" rotate="auto" dur="10s" repeatCount="indefinite"
                   calcMode="linear" keyPoints="0;0.5;0.5" keyTimes="0;0.3;1"/>
    <path d="M-11,-2.2 L5,-2.2 L11,0 L5,2.2 L-11,2.2 Z M-2,-2 L-7,-11 L-3,-11 L5,-2 Z M-2,2 L-7,11 L-3,11 L5,2 Z M-11,-2 L-14,-6 L-12,-6 L-8,-2 Z M-11,2 L-14,6 L-12,6 L-8,2 Z"
          fill="#e2e8f0"/>
  </g>

  <!-- train dot riding the backup route -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.465;0.475;1" dur="10s" repeatCount="indefinite"/>
    <animateMotion path="M730,320 C820,405 950,405 1040,330" dur="10s" repeatCount="indefinite"
                   calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.47;0.72;1"/>
    <circle r="7" fill="#34d399" filter="url(#glow)"/>
  </g>

  <!-- stations -->
  <g fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5">
    <circle cx="730" cy="320" r="7"/>
    <circle cx="1100" cy="140" r="7"/>
    <circle cx="1040" cy="330" r="7"/>
  </g>
  <text x="716" y="304" text-anchor="end" font-size="15" font-weight="600" fill="#e2e8f0">Origin</text>
  <text x="1100" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Connecting city</text>
  <text x="1058" y="335" font-size="15" font-weight="600" fill="#e2e8f0">Destination</text>
  <text x="1058" y="354" font-size="12.5" fill="#94a3b8">tour at 10:30</text>

  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.315;0.327;1" dur="10s" repeatCount="indefinite"/><rect x="842" y="100" width="112" height="26" rx="13" fill="#3b1219" stroke="#f87171" stroke-width="1.2"/><text x="898.0" y="117.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#f87171">CANCELLED</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.13;0.142;0.74;0.752;1" dur="10s" repeatCount="indefinite"/><rect x="816" y="392" width="150" height="26" rx="13" fill="#0f2e25" stroke="#34d399" stroke-width="1.2"/><text x="891.0" y="409.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#34d399">BACKUP SEAT HELD</text></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.762;1" dur="10s" repeatCount="indefinite"/><rect x="866" y="250" width="132" height="26" rx="13" fill="#0f2e25" stroke="#34d399" stroke-width="1.2"/><text x="932.0" y="267.5" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1" fill="#34d399">PLAN A · ON TIME</text></g>

  <!-- status line and the domino chips -->
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0;0.012;0.12;0.132;1" dur="10s" repeatCount="indefinite"/><circle cx="78" cy="300" r="5" fill="#fbbf24"/><text x="92" y="305" font-size="17" fill="#e2e8f0">Watching warning signs: incoming plane fails to land</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.132;0.3;0.312;1" dur="10s" repeatCount="indefinite"/><circle cx="78" cy="300" r="5" fill="#34d399"/><text x="92" y="305" font-size="17" fill="#e2e8f0">Chance 19%: refundable backup seat held, ₹0 paid</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.312;0.47;0.482;1" dur="10s" repeatCount="indefinite"/><circle cx="78" cy="300" r="5" fill="#f87171"/><text x="92" y="305" font-size="17" fill="#e2e8f0">Flight cancelled: cab, hotel, train and tour break</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.482;0.74;0.752;1" dur="10s" repeatCount="indefinite"/><circle cx="78" cy="300" r="5" fill="#60a5fa"/><text x="92" y="305" font-size="17" fill="#e2e8f0">Rerouting via the backup seat already held</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.752;1" dur="10s" repeatCount="indefinite"/><circle cx="78" cy="300" r="5" fill="#34d399"/><text x="92" y="305" font-size="17" fill="#e2e8f0">Recovered: Plan A reaches the 10:30 tour</text></g>
  
    <g>
      <rect x="70" y="340" width="80" height="32" rx="8" stroke-width="1.5">
        <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#f87171;#475569;#475569" keyTimes="0;0.31;0.325;0.74;0.755;1" dur="10s" repeatCount="indefinite"/><animate attributeName="fill" values="#16233b;#16233b;#3b1219;#3b1219;#111827;#111827" keyTimes="0;0.31;0.325;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <text x="110.0" y="361" text-anchor="middle" font-size="14" font-weight="600">Flight
        <animate attributeName="fill" values="#cbd5e1;#cbd5e1;#fecaca;#fecaca;#64748b;#64748b" keyTimes="0;0.31;0.325;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </text>
    </g>
    <g>
      <rect x="160" y="340" width="80" height="32" rx="8" stroke-width="1.5">
        <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#f87171;#475569;#475569" keyTimes="0;0.34;0.355;0.74;0.755;1" dur="10s" repeatCount="indefinite"/><animate attributeName="fill" values="#16233b;#16233b;#3b1219;#3b1219;#111827;#111827" keyTimes="0;0.34;0.355;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <text x="200.0" y="361" text-anchor="middle" font-size="14" font-weight="600">Cab
        <animate attributeName="fill" values="#cbd5e1;#cbd5e1;#fecaca;#fecaca;#64748b;#64748b" keyTimes="0;0.34;0.355;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </text>
    </g>
    <g>
      <rect x="250" y="340" width="80" height="32" rx="8" stroke-width="1.5">
        <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#f87171;#475569;#475569" keyTimes="0;0.37;0.385;0.74;0.755;1" dur="10s" repeatCount="indefinite"/><animate attributeName="fill" values="#16233b;#16233b;#3b1219;#3b1219;#111827;#111827" keyTimes="0;0.37;0.385;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <text x="290.0" y="361" text-anchor="middle" font-size="14" font-weight="600">Hotel
        <animate attributeName="fill" values="#cbd5e1;#cbd5e1;#fecaca;#fecaca;#64748b;#64748b" keyTimes="0;0.37;0.385;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </text>
    </g>
    <g>
      <rect x="340" y="340" width="80" height="32" rx="8" stroke-width="1.5">
        <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#f87171;#475569;#475569" keyTimes="0;0.4;0.415;0.74;0.755;1" dur="10s" repeatCount="indefinite"/><animate attributeName="fill" values="#16233b;#16233b;#3b1219;#3b1219;#111827;#111827" keyTimes="0;0.4;0.415;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <text x="380.0" y="361" text-anchor="middle" font-size="14" font-weight="600">Train
        <animate attributeName="fill" values="#cbd5e1;#cbd5e1;#fecaca;#fecaca;#64748b;#64748b" keyTimes="0;0.4;0.415;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </text>
    </g>
    <g>
      <rect x="430" y="340" width="80" height="32" rx="8" stroke-width="1.5">
        <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#f87171;#34d399;#34d399" keyTimes="0;0.43;0.445;0.74;0.755;1" dur="10s" repeatCount="indefinite"/><animate attributeName="fill" values="#16233b;#16233b;#3b1219;#3b1219;#0f2e25;#0f2e25" keyTimes="0;0.43;0.445;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <text x="470.0" y="361" text-anchor="middle" font-size="14" font-weight="600">Tour
        <animate attributeName="fill" values="#cbd5e1;#cbd5e1;#fecaca;#fecaca;#a7f3d0;#a7f3d0" keyTimes="0;0.43;0.445;0.74;0.755;1" dur="10s" repeatCount="indefinite"/>
      </text>
    </g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.762;1" dur="10s" repeatCount="indefinite"/>
    <rect x="520" y="340" width="130" height="32" rx="8" fill="#0f2e25" stroke="#34d399" stroke-width="1.5"/>
    <text x="585" y="361" text-anchor="middle" font-size="14" font-weight="600" fill="#a7f3d0">Backup train</text>
  </g>

  <!-- soft fade between loops -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)" opacity="1">
    <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.03;0.97;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- static title, always on top -->
  <text x="72" y="92" font-size="14" font-weight="700" letter-spacing="3" fill="#7dd3fc">DEVHOST 2026 · PS 4.1</text>
  <text x="66" y="172" font-size="80" font-weight="800" fill="#f8fafc" letter-spacing="-1">Reroute</text>
  <text x="72" y="214" font-size="21" fill="#cbd5e1">Fixes the whole trip when one booking breaks,</text>
  <text x="72" y="243" font-size="21" fill="#cbd5e1">and starts before the airline says anything.</text>
  </g>
</svg>
